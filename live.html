<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseWalk – Live walk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: #0A1220; color: #E8EEF6; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 1000; background: rgba(19,29,48,0.95);
           border-radius: 20px; padding: 16px 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .brand { font-weight: 800; font-size: 18px; } .brand span { color: #22D3EE; }
  .name { font-size: 20px; font-weight: 800; margin-top: 6px; }
  .row { display: flex; gap: 18px; margin-top: 10px; }
  .stat b { display: block; font-size: 20px; } .stat small { color: #94A3B8; }
  .status { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; margin-top: 8px; }
  .walking { background: #0D3350; color: #29B6F6; } .paused { background: #33300d; color: #FFB300; } .finished { background: #0D3B2A; color: #22C55E; }
  a { color: #22D3EE; } .muted { color: #94A3B8; font-size: 13px; margin-top: 8px; }
  /* Dark map look */
  .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  .leaflet-container { background: #0A1220; }
  .me { width: 18px; height: 18px; border-radius: 50%; background: #29B6F6; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(41,182,246,0.3); }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="brand">Pulse<span>Walk</span> • Live walk</div>
  <div class="name" id="name">Loading…</div>
  <div id="status" class="status walking">Connecting</div>
  <div class="row">
    <div class="stat"><b id="dist">–</b><small>distance</small></div>
    <div class="stat"><b id="time">–</b><small>time</small></div>
  </div>
  <div class="muted" id="updated"></div>
  <div class="muted"><a id="gmaps" href="#" target="_blank">Open in Google Maps</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // The app adds the project (p) and share id (id) to the link automatically – nothing to edit here.
  const params = new URLSearchParams(location.search);
  const PROJECT_ID = params.get("p");
  const id = params.get("id");
  const map = L.map("map", { zoomControl: false }).setView([7.9, -1.0], 6);
  // Free OpenStreetMap tiles (no key). The CSS filter above turns them dark.
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19
  }).addTo(map);
  const marker = L.marker([0, 0], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [24, 24], iconAnchor: [12, 12] }) });
  const trail = L.polyline([], { color: "#22D3EE", weight: 5 }).addTo(map);
  let first = true;

  const val = (f) => f ? (f.doubleValue ?? (f.integerValue != null ? Number(f.integerValue) : undefined) ?? f.stringValue ?? f.booleanValue ?? f.timestampValue) : undefined;
  const fmtTime = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0"); };

  async function refresh() {
    if (!id || !PROJECT_ID) { document.getElementById("name").textContent = "This link is incomplete"; return; }
    try {
      const r = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/shares/${id}`);
      if (!r.ok) { document.getElementById("name").textContent = "This live link isn't available"; return; }
      const f = (await r.json()).fields || {};
      const name = val(f.name) || "PulseWalk walker";
      const status = val(f.status) || "walking";
      const active = val(f.active);
      document.getElementById("name").textContent = name;
      const st = document.getElementById("status");
      st.className = "status " + (active === false ? "finished" : status);
      st.textContent = active === false ? "Walk finished – sharing stopped" : (status === "paused" ? "Paused" : "Walking now");
      const d = val(f.distanceMeters) || 0;
      document.getElementById("dist").textContent = (d / 1000).toFixed(2) + " km";
      document.getElementById("time").textContent = fmtTime(val(f.elapsedMs) || 0);
      const upd = val(f.updatedAt);
      if (upd) document.getElementById("updated").textContent = "Last update: " + new Date(upd).toLocaleTimeString();
      const lat = val(f.lat), lng = val(f.lng);
      if (lat != null && lng != null) {
        const p = [lat, lng];
        marker.setLatLng(p).addTo(map);
        const pts = trail.getLatLngs();
        const last = pts[pts.length - 1];
        if (!last || last.lat !== lat || last.lng !== lng) trail.addLatLng(p);
        if (first) { map.setView(p, 16); first = false; } else { map.panTo(p); }
        document.getElementById("gmaps").href = `https://www.google.com/maps?q=${lat},${lng}`;
      }
    } catch (e) { /* try again next time */ }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
